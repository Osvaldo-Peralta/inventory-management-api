[project]
name = "inventory-management-api"
version = "0.1.0"
requires-python = ">=3.13"

dependencies = [
    "fastapi",
    "uvicorn[standard]",

    "sqlalchemy",
    "asyncpg",
    "alembic",

    "pydantic",
    "pydantic-settings",

    "python-jose[cryptography]",
    "passlib[bcrypt]",
    "python-multipart",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",

    "ruff",
    "mypy",
]